<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0613">
<title>Create Restaurant</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400..800&family=Noto+Sans+Kannada:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/auth.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="/static/js/common.js"></script>
<script type="module" src="/static/js/bg3d.js"></script>
</head>
<body>
<div class="grain"></div>
<div class="app auth-wrap">
  <a class="brand auth-brand" href="/"><span class="brand-mark" id="mark"></span><span>Bolo Dukaan</span></a>
  <form class="glass auth-card reveal" data-tilt="4" id="form" novalidate>
    <div class="eyebrow">Step 1 of 3</div>
    <h2 style="margin:8px 0 6px">Create your <span class="hot-text serif-i">restaurant</span></h2>
    <p class="muted" style="margin:0 0 22px">Takes about a minute. Tables and menu come next.</p>
    <div class="stack">
      <label class="field"><span>Restaurant name</span><input class="input" name="restaurant_name" placeholder="e.g. Dosa Corner" autocomplete="organization" required></label>
      <div id="gbox"></div>
      <div class="or">or with email</div>
      <label class="field"><span>Email</span><input class="input" type="email" name="email" placeholder="you@restaurant.com" autocomplete="email" required></label>
      <label class="field"><span>Password</span><input class="input" type="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required></label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn lg block" id="go">Create my restaurant →</button>
      <p class="center small muted" style="margin:4px 0 0">Already set up? <a href="/owner/login">Log in</a></p>
    </div>
  </form>
  <div class="steps-strip reveal" style="--d:.15s"><span class="on">Account</span><i></i><span>Tables & Wi-Fi</span><i></i><span>Menu</span></div>
</div>
<script>
document.getElementById("mark").innerHTML = BD.logoSvg;
const form = document.getElementById("form"), err = document.getElementById("err"), go = document.getElementById("go");
BD.googleButton(document.getElementById("gbox"), "signup",
  () => ({ restaurant_name: form.restaurant_name.value.trim() }),
  msg => { err.textContent = msg; });
form.addEventListener("submit", async e => {
  e.preventDefault(); err.textContent = "";
  const d = Object.fromEntries(new FormData(form));
  if (!d.restaurant_name.trim()) return err.textContent = "Please enter the restaurant name";
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email.trim())) return err.textContent = "Please enter a valid email";
  if (d.password.length < 6) return err.textContent = "Password must be at least 6 characters";
  BD.busy(go, true, "Creating…");
  try {
    const r = await BD.api("/api/owner/signup", { body: d });
    form.classList.add("leave");
    setTimeout(() => location.href = r.next, 350);
  } catch (x) { err.textContent = x.message; BD.busy(go, false); }
});
</script>
</body>
</html>
