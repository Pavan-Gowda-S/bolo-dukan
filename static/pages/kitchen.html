<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07040d">
<title>Kitchen Display</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600..700&family=Plus+Jakarta+Sans:wght@500..800&family=Noto+Sans+Kannada:wght@500..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body { background: #07040d; overflow: hidden; }
  .k-top { display: flex; align-items: center; gap: 18px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #120a20, #07040d); }
  .k-top h1 { font-size: clamp(1.4rem, 2.6vw, 2.2rem); }
  .k-clock { margin-left: auto; font-family: var(--font-display); font-size: clamp(1.6rem, 3vw, 2.6rem); font-variant-numeric: tabular-nums; }
  .k-stat { font-size: 1.1rem; color: var(--muted); font-weight: 700; }
  .k-conn { padding: 6px 14px; border-radius: 99px; font-weight: 800; font-size: .95rem; background: rgba(46,230,166,.15); color: var(--mint); }
  .k-conn.off { background: rgba(239,68,68,.2); color: #ff8fa3; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  .k-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; padding: 22px 28px; height: calc(100dvh - 90px); overflow: auto; align-content: start; }
  .tk { border-radius: 22px; padding: 18px 20px; background: linear-gradient(160deg, #1a1030, #120a22); border: 3px solid rgba(46,230,166,.55); box-shadow: 0 20px 50px -20px rgba(0,0,0,.9); transition: border-color .6s; }
  .tk.amber { border-color: #f59e0b; } .tk.red { border-color: #ef4444; animation: pulseRed 1.6s ease-in-out infinite; }
  .tk.new { animation: slideIn .6s var(--spring) both; box-shadow: 0 0 0 6px rgba(255,193,69,.5), 0 20px 50px -20px rgba(0,0,0,.9); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-30px) scale(.94); } }
  @keyframes pulseRed { 50% { box-shadow: 0 0 0 6px rgba(239,68,68,.35), 0 20px 50px -20px rgba(0,0,0,.9); } }
  .tk-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 2px dashed rgba(255,255,255,.15); padding-bottom: 10px; margin-bottom: 10px; }
  .tk-t { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; }
  .tk-t small { display: block; font-family: var(--font); font-size: .95rem; color: var(--muted); font-weight: 700; margin-top: 4px; }
  .tk-time { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tk.amber .tk-time { color: #fbbf24; } .tk.red .tk-time { color: #ff6b6b; }
  .tk-i { display: flex; gap: 14px; align-items: baseline; padding: 6px 0; font-size: 1.55rem; font-weight: 700; line-height: 1.2; }
  .tk-i b { min-width: 56px; font-size: 2rem; color: var(--marigold); font-variant-numeric: tabular-nums; }
  .tk-i small { display: block; font-size: 1.05rem; color: var(--muted); font-weight: 600; }
  .cook { display: inline-block; padding: 4px 12px; border-radius: 99px; background: rgba(251,146,60,.2); color: #fdba74; font-weight: 800; font-size: 1rem; margin-top: 8px; }
  .empty-k { grid-column: 1 / -1; text-align: center; padding: 18vh 0; color: var(--faint); font-size: 1.6rem; }
  .start { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(7,4,13,.96); }
  .start .btn { font-size: 1.6rem; padding: 24px 46px; }
  .say { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 14px 24px; border-radius: 18px; background: rgba(255,193,69,.15); border: 1px solid rgba(255,193,69,.5); font-size: 1.4rem; font-weight: 700; max-width: 90vw; transition: opacity .4s; }
</style>
</head>
<body>
<div class="start" id="start"><div class="center"><div style="font-size:4rem">👨‍🍳</div><h1 style="margin:10px 0 24px;font-size:2.4rem" id="sTitle">Kitchen display</h1>
  <button class="btn lg" id="go">▶ Start display</button><p class="muted" style="margin-top:18px">One tap turns on sound and full screen. After that, no touching needed.</p></div></div>
<header class="k-top"><h1 id="rname">Kitchen</h1><span class="k-stat" id="kstat"></span><span class="k-conn" id="conn">● Live</span><span class="k-clock" id="clock"></span></header>
<main class="k-grid" id="grid"><div class="empty-k">Loading…</div></main>
<div class="say hidden" id="say"></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/kitchen.js"></script>
</body>
</html>
