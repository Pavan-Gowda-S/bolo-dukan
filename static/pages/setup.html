<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0613">
<title>Restaurant Setup</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400..800&family=Noto+Sans+Kannada:wght@400..700&family=Noto+Sans+Devanagari:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="/static/js/common.js"></script>
<script type="module" src="/static/js/bg3d.js"></script>
<style>
  .setup { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; padding: 34px 0 70px; align-items: start; }
  .big-step { display: flex; align-items: center; gap: 16px; }
  .big-step .stepper button { width: 46px; height: 46px; font-size: 1.4rem; }
  .big-step .val { font-family: var(--font-display); font-size: 2.6rem; min-width: 64px; }
  .floor-wrap { perspective: 1100px; padding: 20px 10px 40px; overflow: hidden; }
  .floor { transform: rotateX(56deg) rotateZ(-30deg); transform-style: preserve-3d; display: grid; gap: 18px; justify-content: center; padding: 26px;
    border-radius: 28px; background: radial-gradient(circle at 50% 40%, rgba(255,159,28,.12), transparent 70%), repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 34px), repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 34px), #160d26;
    border: 1px solid var(--line); box-shadow: 0 60px 80px -30px rgba(0,0,0,.8); transition: transform 1s var(--ease); }
  .floor-wrap:hover .floor { transform: rotateX(48deg) rotateZ(-22deg); }
  .mini { width: 52px; height: 52px; border-radius: 50%; position: relative; transform-style: preserve-3d; animation: drop .6s var(--spring) both; }
  .mini .tp { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c08a5f, #7a4b2f); transform: translateZ(22px); box-shadow: 0 0 0 3px rgba(255,193,69,.35); display: grid; place-items: center; font-weight: 800; color: #fff3e0; font-size: .95rem; }
  .mini .sh { position: absolute; inset: 6px; border-radius: 50%; background: rgba(0,0,0,.55); filter: blur(6px); }
  .mini .lg { position: absolute; left: 50%; top: 50%; width: 6px; height: 22px; background: #2b2238; transform-origin: top; transform: translate(-50%, 0) rotateX(-90deg); }
  @keyframes drop { from { opacity: 0; transform: translateZ(120px) scale(.6); } }
  .lang-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .lang-opts label { cursor: pointer; }
  .lang-opts input { position: absolute; opacity: 0; }
  .lang-opts .opt { display: grid; gap: 2px; padding: 14px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(255,255,255,.04); text-align: center; transition: all .25s var(--ease); }
  .lang-opts .opt b { font-size: 1.15rem; }
  .lang-opts input:checked + .opt { border-color: var(--marigold); background: rgba(255,193,69,.12); box-shadow: 0 10px 30px -12px rgba(255,159,28,.6); transform: translateY(-2px); }
  .lang-opts input:focus-visible + .opt { outline: 2px solid var(--marigold); outline-offset: 2px; }
  @media (max-width: 900px) { .setup { grid-template-columns: 1fr; } .preview { order: -1; } }
</style>
</head>
<body>
<div class="grain"></div>
<div class="app">
  <header class="topbar" id="nav"></header>
  <main class="container setup">
    <form class="glass card-lg reveal" id="form" novalidate>
      <div class="eyebrow">Step 2 of 3</div>
      <h2 style="margin:8px 0 24px">Set up your <span class="hot-text serif-i">floor</span></h2>
      <div class="stack" style="gap:22px">
        <label class="field"><span>Restaurant name</span><input class="input" name="name" id="name" maxlength="80"></label>
        <div class="field"><span>How many tables?</span>
          <div class="big-step"><div class="stepper"><button type="button" id="minus" aria-label="Fewer tables">−</button><span class="val mono" id="count">8</span><button type="button" id="plus" aria-label="More tables">+</button></div><span class="muted small">Each table gets its own QR code</span></div>
        </div>
        <div class="field"><span>Kitchen language (for spoken alerts)</span>
          <div class="lang-opts">
            <label><input type="radio" name="language" value="kn-IN" checked><span class="opt"><b>ಕನ್ನಡ</b><small class="muted">Kannada</small></span></label>
            <label><input type="radio" name="language" value="hi-IN"><span class="opt"><b>हिंदी</b><small class="muted">Hindi</small></span></label>
            <label><input type="radio" name="language" value="en-IN"><span class="opt"><b>English</b><small class="muted">English</small></span></label>
          </div>
        </div>
        <div class="row wrap" style="gap:14px">
          <label class="field grow" style="min-width:180px"><span>Wi-Fi name</span><input class="input" name="wifi_name" id="wifi_name" maxlength="60" placeholder="Optional"></label>
          <label class="field grow" style="min-width:180px"><span>Wi-Fi password</span><input class="input" name="wifi_password" id="wifi_password" maxlength="60" placeholder="Shown to guests"></label>
        </div>
        <div class="err" id="err" role="alert"></div>
        <button class="btn lg block" id="go">Save &amp; continue →</button>
      </div>
    </form>
    <section class="preview reveal" style="--d:.12s">
      <div class="glass card" style="padding:18px 18px 0">
        <div class="row spread"><strong id="pvTitle">Your floor</strong><span class="chip" id="pvCount">8 tables</span></div>
        <div class="floor-wrap"><div class="floor" id="floor"></div></div>
      </div>
      <p class="muted small center" style="margin-top:14px">Changing the number later keeps the existing QR codes working.</p>
    </section>
  </main>
</div>
<script>
BD.ownerNav("/owner/setup");
let count = 8, menuCount = 0;
const $ = id => document.getElementById(id);
function drawFloor() {
  $("count").textContent = count;
  $("pvCount").textContent = count + (count === 1 ? " table" : " tables");
  const cols = Math.min(6, Math.ceil(Math.sqrt(count * 1.5)));
  const floor = $("floor");
  floor.style.gridTemplateColumns = `repeat(${cols}, 52px)`;
  const have = floor.children.length;
  for (let i = have; i < count; i++) {
    const d = document.createElement("div"); d.className = "mini"; d.style.animationDelay = (i - have) * 0.04 + "s";
    d.innerHTML = `<span class="sh"></span><span class="lg"></span><span class="tp">${i + 1}</span>`; floor.appendChild(d);
  }
  while (floor.children.length > count) floor.lastChild.remove();
}
$("minus").onclick = () => { if (count > 1) { count--; drawFloor(); } };
$("plus").onclick = () => { if (count < 60) { count++; drawFloor(); } };
$("name").addEventListener("input", e => $("pvTitle").textContent = e.target.value || "Your floor");

(async () => {
  const me = await BD.requireOwner();
  const r = me.restaurant; menuCount = me.menu_count;
  $("name").value = r.name; $("pvTitle").textContent = r.name;
  if (r.table_count) count = r.table_count;
  $("wifi_name").value = r.wifi_name || ""; $("wifi_password").value = r.wifi_password || "";
  const radio = document.querySelector(`input[name=language][value="${r.language}"]`); if (radio) radio.checked = true;
  $("go").innerHTML = menuCount ? "Save &amp; show QR codes →" : "Save &amp; add the menu →";
  drawFloor();
})();
drawFloor();

$("form").addEventListener("submit", async e => {
  e.preventDefault(); $("err").textContent = "";
  const fd = new FormData($("form"));
  BD.busy($("go"), true, "Saving…");
  try {
    await BD.api("/api/owner/setup", { body: { name: fd.get("name"), table_count: count, language: fd.get("language"), wifi_name: fd.get("wifi_name"), wifi_password: fd.get("wifi_password") } });
    location.href = menuCount ? "/owner/qr" : "/owner/menu?onboarding=1";
  } catch (x) { $("err").textContent = x.message; BD.busy($("go"), false); }
});
</script>
</body>
</html>
