<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0613">
<title>Waiter</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400..800&family=Noto+Sans+Kannada:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  .w-head { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(10,6,19,.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .w-head .who { font-weight: 800; } .w-head .r { color: var(--muted); font-size: .85rem; }
  .w-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; padding: 14px 16px 40px; }
  .wt { border-radius: 20px; padding: 14px; border: 2px solid var(--c, var(--line)); background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); }
  .w-grid.first .wt { animation: wIn .45s var(--ease) both; }
  .wt.hot { animation: glow 1.4s ease-in-out infinite; }
  .w-grid.first .wt.hot { animation: wIn .45s var(--ease) both, glow 1.4s ease-in-out infinite; }
  @keyframes wIn { from { opacity: 0; transform: translateY(12px); } }
  @keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 35%, transparent); } }
  .wt-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .wt-n { font-family: var(--font-display); font-size: 1.8rem; }
  .wt-n small { font-family: var(--font); font-size: .8rem; color: var(--muted); font-weight: 700; display: block; }
  .wt-st { font-weight: 800; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--c); }
  .chk { display: flex; gap: 10px; align-items: center; padding: 8px 4px; border-top: 1px dashed var(--line); font-size: 1.05rem; cursor: pointer; }
  .chk input { width: 22px; height: 22px; accent-color: var(--mint); }
  .chk b { min-width: 34px; color: var(--marigold); }
  .ord { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(0,0,0,.25); }
  .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .acts .btn, .acts .btn-ghost { flex: 1; }
  .call { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(239,68,68,.14); border: 1px solid rgba(239,68,68,.5); display: flex; align-items: center; gap: 10px; }
</style>
<script src="/static/js/common.js"></script>
</head>
<body>
<div class="grain"></div>
<div class="app">
  <header class="w-head"><div class="grow"><div class="who" id="who">Waiter</div><div class="r" id="rname"></div></div>
    <button class="btn-ghost sm" id="soundBtn">🔔 Sound</button><button class="btn-ghost sm" id="logout">Log out</button></header>
  <main class="w-grid first" id="grid"><div class="muted" style="padding:30px">Loading…</div></main>
</div>
<script src="/static/js/waiter.js"></script>
</body>
</html>
